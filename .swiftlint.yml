# SwiftLint configuration for local_ai_test.
#
# Applies to project code only. Vendored sources under
# SourcePackages/, DerivedData, and .build are excluded.

included:
  - local_ai_test
  - local_ai_testTests
  - local_ai_testUITests

excluded:
  - "**/DerivedData"
  - "**/.build"
  - "**/SourcePackages"
  - Scripts

disabled_rules:
  # Allow TODO comments in pre-release scaffolding.
  - todo
  # We rely on SwiftUI @State and @Binding, which trip this rule.
  - weak_delegate
  # The Core ML + MLX APIs are heavy — shorter method bodies would hurt readability.
  - function_body_length
  - type_body_length
  # Auto-formatters already handle trailing whitespace consistently.
  - trailing_whitespace
  # Tests use #expect everywhere; chain length is fine.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 600
  error: 900

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 80
  excluded:
    - id
    - i
    - j
    - k
    - x
    - y
    - z
    - sr  # sample rate

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

reporter: "xcode"
